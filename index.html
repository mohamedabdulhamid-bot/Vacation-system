<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الإجازات - لوحة المهندس</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 (Professional Popups) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* تأثيرات SweetAlert */
        .swal2-title { font-family: 'Tajawal', sans-serif !important; }
        .swal2-html-container { font-family: 'Tajawal', sans-serif !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        
        <!-- رأس الصفحة -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-5 rounded-2xl shadow-md mb-6 border-b-4 border-blue-600">
            <div class="flex items-center gap-4">
                <div class="bg-blue-100 p-3 rounded-full text-2xl">📋</div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800">نظام إدارة الإجازات</h1>
                    <p class="text-sm text-slate-500 font-medium mt-1">البوابة الرسمية لاعتماد ومتابعة الطلبات</p>
                </div>
            </div>
            <div id="adminArea" class="mt-4 sm:mt-0">
                <button onclick="toggleAdmin()" id="adminBtn" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-lg transition-all flex items-center gap-2">
                    <span>🔒</span> <span>دخول المهندس</span>
                </button>
            </div>
        </div>

        <!-- ⚙️ لوحة تحكم المهندس (تظهر للأدمن فقط) ⚙️ -->
        <div id="adminSettingsPanel" class="hidden bg-slate-800 text-white p-6 rounded-2xl shadow-xl mb-6 border border-slate-700 relative overflow-hidden">
            <div class="absolute -left-10 -top-10 text-9xl opacity-5">⚙️</div>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span>🛠️</span> <span>إعدادات المهندس - إدارة الحسابات</span></h2>
            <div class="flex flex-col sm:flex-row items-end gap-4 relative z-10">
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-semibold text-slate-300 mb-1">اختر المشرف</label>
                    <select id="adminSupSelect" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- الخيارات ستتم إضافتها تلقائياً -->
                    </select>
                </div>
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-semibold text-slate-300 mb-1">كلمة المرور الجديدة</label>
                    <input type="text" id="adminNewPass" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل الباسورد الجديد...">
                </div>
                <div class="w-full sm:w-1/3">
                    <button onclick="changePassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-lg shadow transition-all">
                        تحديث كلمة المرور
                    </button>
                </div>
            </div>
        </div>

        <!-- نموذج الإدخال -->
        <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-md mb-6 border border-slate-200">
            <h2 id="formTitle" class="text-lg font-bold text-slate-700 mb-5 flex items-center gap-2 border-b pb-3">
                <span class="text-xl">📝</span> تسجيل طلب إجازة جديد
            </h2>
            
            <form id="vacationForm" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">اسم الموظف <span class="text-red-500">*</span></label>
                        <input type="text" id="employeeName" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="الاسم ثلاثي">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">المشرف <span class="text-red-500">*</span></label>
                        <select id="supervisorName" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                            <!-- الخيارات سيتم تعبئتها ديناميكياً لتطابق لوحة الأدمن -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">نوع الإجازة <span class="text-red-500">*</span></label>
                        <select id="vacationType" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="سنوي">سنوي</option>
                            <option value="عارضة">عارضة</option>
                            <option value="بدل">بدل</option>
                            <option value="بالخصم">بالخصم</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">عدد أيام الإجازة <span class="text-red-500">*</span></label>
                        <select id="vacationDays" onchange="generateDateInputs()" class="w-full border border-blue-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50 font-bold text-center text-blue-700">
                            <option value="1">1 يوم</option><option value="2">2 يوم</option>
                            <option value="3">3 أيام</option><option value="4">4 أيام</option><option value="5">5 أيام</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-600 mb-3">📅 تواريخ الإجازة المطلوبة:</h3>
                    <div id="datesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3"></div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-500 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg font-bold shadow transition-all">إلغاء التعديل</button>
                    <button type="submit" id="submitBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-2.5 rounded-lg font-bold shadow-md transition-all flex items-center gap-2">
                        <span>حفظ الطلب</span> <span>💾</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول الطلبات -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-300">
            <!-- شريط البحث الاحترافي -->
            <div class="bg-slate-100 p-4 border-b border-slate-300 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-extrabold text-slate-700 text-lg">🗂️ سجل الإجازات</h2>
                    <span id="totalRequests" class="bg-blue-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">0</span>
                </div>
                <div class="w-full sm:w-1/3 relative">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 ابحث باسم الموظف أو المشرف..." class="w-full border border-slate-300 rounded-full py-2 px-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse" id="vacationsTable">
                    <thead>
                        <tr class="bg-slate-800 text-white text-sm">
                            <th class="p-3 border border-slate-700 text-center w-12">م</th>
                            <th class="p-3 border border-slate-700">اسم الموظف</th>
                            <th class="p-3 border border-slate-700 text-center w-24">نوع الإجازة</th>
                            <th class="p-3 border border-slate-700 text-center w-24">عدد الأيام</th>
                            <th class="p-0 border border-slate-700 text-center w-36">التاريخ</th>
                            <th class="p-3 border border-slate-700 text-center w-32">المشرف</th>
                            <th class="p-3 border border-slate-700 text-center w-24">التنفيذ</th>
                            <th class="p-3 border border-slate-700 text-center w-32">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="vacationTableBody" class="text-slate-700 text-sm font-medium">
                        <!-- Data -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🛑 بيانات مشروعك 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyDVdEQBp3X0kIZgpMQIKOOHuCBbGe23A",
            authDomain: "my-vacation-app-fedab.firebaseapp.com",
            projectId: "my-vacation-app-fedab",
            storageBucket: "my-vacation-app-fedab.firebasestorage.app",
            messagingSenderId: "300432655208",
            appId: "1:300432655208:web:c8e6128d15691c8da40cdd",
            measurementId: "G-B8NZSBCQ7S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // قائمة المشرفين 
        const supervisorsList = [
            "حميدة", "حسام", "أبو حمزة", "أبو حمرة", "معتصم", "ميشو", 
            "محمد صابر", "محمد إسماعيل", "إسلام رمضان", "رشدي", "محمد سمير", "أحمد تركي"
        ];

        let supervisorPasswords = {};
        let isAdmin = false;
        let editingId = null; 

        // 1. تعبئة قوائم المشرفين في الفورم ولوحة الأدمن
        function populateSupervisors() {
            const formSelect = document.getElementById('supervisorName');
            const adminSelect = document.getElementById('adminSupSelect');
            let options = '';
            supervisorsList.forEach(sup => { options += `<option value="${sup}">${sup}</option>`; });
            formSelect.innerHTML = options;
            adminSelect.innerHTML = options;
        }

        // 2. تحميل كلمات المرور من قاعدة البيانات
        async function initPasswords() {
            try {
                const passRef = doc(db, "settings", "passwords");
                const docSnap = await getDoc(passRef);
                if (docSnap.exists()) {
                    supervisorPasswords = docSnap.data();
                } else {
                    // لو أول مرة يفتح الموقع، نعمل باسورد 1234 لكل المشرفين
                    supervisorsList.forEach(sup => { supervisorPasswords[sup] = "1234"; });
                    await setDoc(passRef, supervisorPasswords);
                }
            } catch (error) {
                console.error("Error loading passwords", error);
            }
        }

        // دالة إنشاء خانات التواريخ
        window.generateDateInputs = function(prefillDates = []) {
            const count = parseInt(document.getElementById('vacationDays').value);
            const container = document.getElementById('datesContainer');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                let dateValue = prefillDates[i] ? prefillDates[i] : '';
                container.innerHTML += `
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">تاريخ اليوم (${i + 1})</label>
                        <input type="date" value="${dateValue}" class="vacation-date-input w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>`;
            }
        }

        // دخول المهندس
        window.toggleAdmin = async function() {
            if (!isAdmin) {
                const { value: pass } = await Swal.fire({
                    title: 'دخول المهندس',
                    input: 'password',
                    inputPlaceholder: 'أدخل الرقم السري للمهندس...',
                    confirmButtonText: 'دخول',
                    confirmButtonColor: '#2563eb'
                });
                
                if (pass === "2030") {
                    isAdmin = true;
                    document.getElementById('adminBtn').innerHTML = "<span>🔓</span> <span>خروج المهندس</span>";
                    document.getElementById('adminBtn').className = "bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-lg transition-all flex items-center gap-2";
                    document.getElementById('adminSettingsPanel').classList.remove('hidden');
                    loadData();
                    Swal.fire({icon: 'success', title: 'تم الدخول', text: 'تم تفعيل صلاحيات المهندس بنجاح', timer: 1500, showConfirmButton: false});
                } else if (pass) {
                    Swal.fire({icon: 'error', title: 'خطأ', text: 'كلمة المرور غير صحيحة!'});
                }
            } else {
                isAdmin = false;
                document.getElementById('adminBtn').innerHTML = "<span>🔒</span> <span>دخول المهندس</span>";
                document.getElementById('adminBtn').className = "bg-slate-800 hover:bg-slate-900 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-lg transition-all flex items-center gap-2";
                document.getElementById('adminSettingsPanel').classList.add('hidden');
                loadData();
            }
        }

        // تغيير باسورد المشرف من لوحة المهندس
        window.changePassword = async function() {
            let sup = document.getElementById('adminSupSelect').value;
            let newPass = document.getElementById('adminNewPass').value;
            if (!newPass) return Swal.fire({icon: 'warning', text: 'يرجى كتابة كلمة المرور الجديدة'});
            
            try {
                supervisorPasswords[sup] = newPass;
                await setDoc(doc(db, "settings", "passwords"), supervisorPasswords);
                document.getElementById('adminNewPass').value = '';
                Swal.fire({icon: 'success', title: 'تم التحديث', text: `تم تغيير باسورد المشرف ${sup} بنجاح`});
            } catch (error) {
                Swal.fire({icon: 'error', title: 'خطأ', text: error.message});
            }
        }

        // التحقق من هوية المشرف
        async function verifySupervisorAuth(supervisorName) {
            if (isAdmin) return true; // المهندس يقدر يعمل أي حاجة
            
            const { value: pass } = await Swal.fire({
                title: 'تأكيد الهوية',
                text: `يرجى إدخال الرقم السري الخاص بالمشرف (${supervisorName})`,
                input: 'password',
                showCancelButton: true,
                confirmButtonText: 'تأكيد',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#10b981'
            });

            if (pass === supervisorPasswords[supervisorName]) {
                return true;
            } else if (pass) {
                Swal.fire({icon: 'error', title: 'عذراً', text: 'الرقم السري غير صحيح!'});
            }
            return false;
        }

        // جلب البيانات
        async function loadData() {
            const tableBody = document.getElementById('vacationTableBody');
            tableBody.innerHTML = `<tr><td colspan="8" class="p-6 text-center font-bold text-blue-600">⏳ جاري التحميل...</td></tr>`;
            try {
                const querySnapshot = await getDocs(collection(db, "vacations"));
                let requests = [];
                querySnapshot.forEach((docSnap) => { requests.push({ id: docSnap.id, ...docSnap.data() }); });
                requests.sort((a, b) => a.employeeName.localeCompare(b.employeeName, 'ar'));

                document.getElementById('totalRequests').innerText = requests.length;
                tableBody.innerHTML = "";
                
                if (requests.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-500">لا توجد طلبات إجازة.</td></tr>`;
                    return;
                }

                let index = 1;
                requests.forEach((data) => {
                    let rowColor = data.executed ? "bg-emerald-50" : "bg-red-50";
                    let checkDisabled = isAdmin ? "" : "disabled";
                    let nameStyle = data.executed ? "text-slate-800" : "text-red-600 font-extrabold";
                    
                    let datesArray = data.dates && data.dates.length > 0 ? data.dates : [data.date || ''];
                    let datesHtml = datesArray.map((d, idx) => `<div class="p-2 border-b border-slate-300 font-bold">${d}</div>`).join('');
                    let encodedDates = encodeURIComponent(JSON.stringify(datesArray));

                    let row = `
                        <tr class="${rowColor} border-b border-slate-300 hover:bg-opacity-80 transition">
                            <td class="p-3 border border-slate-300 font-bold text-center">${index++}</td>
                            <td class="p-3 border border-slate-300 ${nameStyle} text-base employee-cell">${data.employeeName}</td>
                            <td class="p-3 border border-slate-300 text-center">${data.vacationType}</td>
                            <td class="p-3 border border-slate-300 text-center font-bold">${data.numberOfDays || datesArray.length}</td>
                            <td class="p-0 border border-slate-300 text-center align-top bg-white/50">${datesHtml}</td>
                            <td class="p-3 border border-slate-300 text-center font-bold supervisor-cell">${data.supervisor}</td>
                            <td class="p-3 border border-slate-300 text-center">
                                <input type="checkbox" ${data.executed ? "checked" : ""} ${checkDisabled} 
                                    onchange="updateExecution('${data.id}', this.checked)" class="w-6 h-6 cursor-pointer accent-emerald-600">
                            </td>
                            <td class="p-3 border border-slate-300 text-center">
                                <div class="flex flex-col sm:flex-row justify-center gap-2">
                                    <button onclick="requestEdit('${data.id}', '${data.employeeName}', '${data.vacationType}', '${data.numberOfDays || datesArray.length}', '${data.supervisor}', '${encodedDates}')" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded shadow text-xs font-bold w-full">تعديل</button>
                                    <button onclick="requestDelete('${data.id}', '${data.supervisor}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded shadow text-xs font-bold w-full">حذف</button>
                                </div>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-500">حدث خطأ في تحميل البيانات.</td></tr>`;
            }
        }

        // فلترة الجدول (بحث)
        window.filterTable = function() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let table = document.getElementById("vacationsTable");
            let tr = table.getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                let empCell = tr[i].querySelector(".employee-cell");
                let supCell = tr[i].querySelector(".supervisor-cell");
                if (empCell || supCell) {
                    let textValue = (empCell.textContent || empCell.innerText) + " " + (supCell.textContent || supCell.innerText);
                    if (textValue.toUpperCase().indexOf(input) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        // زر إضافة الطلب
        document.getElementById('vacationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            let employeeName = document.getElementById('employeeName').value;
            let vacationType = document.getElementById('vacationType').value;
            let supervisor = document.getElementById('supervisorName').value;
            let numberOfDays = document.getElementById('vacationDays').value;
            
            let dateInputs = document.querySelectorAll('.vacation-date-input');
            let datesArray = Array.from(dateInputs).map(input => input.value);

            // لو مش بنعدل طلب، اطلب الباسورد
            if (!editingId) {
                let isAuth = await verifySupervisorAuth(supervisor);
                if (!isAuth) return;
            }

            try {
                if (editingId) {
                    await updateDoc(doc(db, "vacations", editingId), {
                        employeeName, vacationType, numberOfDays, dates: datesArray, supervisor
                    });
                    Swal.fire({icon: 'success', title: 'تم التعديل', timer: 1500, showConfirmButton: false});
                } else {
                    await addDoc(collection(db, "vacations"), {
                        employeeName, vacationType, numberOfDays, dates: datesArray, supervisor, executed: false, timestamp: new Date()
                    });
                    Swal.fire({icon: 'success', title: 'تم إضافة الطلب', timer: 1500, showConfirmButton: false});
                }
                resetForm();
                loadData();
            } catch (error) {
                Swal.fire({icon: 'error', title: 'حدث خطأ', text: error.message});
            }
        });

        // طلب التعديل (يطلب باسورد المشرف صاحب الطلب)
        window.requestEdit = async function(id, name, type, days, sup, encodedDates) {
            let isAuth = await verifySupervisorAuth(sup);
            if (!isAuth) return;

            editingId = id;
            document.getElementById('employeeName').value = name;
            document.getElementById('vacationType').value = type;
            document.getElementById('supervisorName').value = sup;
            document.getElementById('vacationDays').value = days;
            
            let decodedDates = JSON.parse(decodeURIComponent(encodedDates));
            generateDateInputs(decodedDates);

            document.getElementById('formTitle').innerHTML = "✏️ تعديل طلب إجازة";
            let submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = "<span>حفظ التعديلات</span> <span>💾</span>";
            submitBtn.className = "bg-amber-600 hover:bg-amber-700 text-white px-8 py-2.5 rounded-lg font-bold shadow transition-all flex items-center gap-2";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // طلب الحذف
        window.requestDelete = async function(id, rowSup) {
            let isAuth = await verifySupervisorAuth(rowSup);
            if (!isAuth) return;

            const result = await Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "لن تتمكن من استرجاع هذا الطلب بعد الحذف!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، احذفه',
                cancelButtonText: 'إلغاء'
            });

            if (result.isConfirmed) {
                await deleteDoc(doc(db, "vacations", id));
                Swal.fire({icon: 'success', title: 'تم الحذف', timer: 1500, showConfirmButton: false});
                loadData();
            }
        }

        // إلغاء وضع التعديل
        window.resetForm = function() {
            editingId = null;
            document.getElementById('vacationForm').reset();
            document.getElementById('vacationDays').value = "1";
            generateDateInputs(); 
            document.getElementById('formTitle').innerHTML = "📝 تسجيل طلب إجازة جديد";
            let submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = "<span>حفظ الطلب</span> <span>💾</span>";
            submitBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-2.5 rounded-lg font-bold shadow transition-all flex items-center gap-2";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // تحديث التنفيذ (للأدمن فقط)
        window.updateExecution = async function(id, status) {
            if (!isAdmin) return;
            try {
                await updateDoc(doc(db, "vacations", id), { executed: status });
                loadData();
            } catch (error) {
                Swal.fire({icon: 'error', text: error.message});
            }
        }

        // التهيئة الابتدائية
        async function startApp() {
            populateSupervisors();
            generateDateInputs();
            await initPasswords();
            loadData();
        }

        startApp();
    </script>
</body>
    </html>
